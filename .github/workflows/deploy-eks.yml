name: Deploy To EKS

on:
  workflow_call:
    inputs:
      aws_region:
        required: false
        type: string
        default: ""
      aws_role_to_assume:
        required: false
        type: string
        default: ""
      eks_cluster_name:
        required: false
        type: string
        default: ""
      kubernetes_namespace:
        required: true
        type: string
      manifest_dir:
        required: true
        type: string
      docker_image:
        required: true
        type: string
      formio_deployment_name:
        required: false
        type: string
        default: formio
      formio_container_name:
        required: false
        type: string
        default: formio
      unit_test_status:
        required: true
        type: string
      trivy_status:
        required: true
        type: string
      # --- Toggle Inputs ---
      use_aws_auth:
        description: "Set to true to use AWS IAM role authentication"
        required: false
        type: boolean
        default: true
      use_custom_kubeconfig:
        description: "Set to true to use a custom kubeconfig file on the runner"
        required: false
        type: boolean
        default: false
      kubeconfig_path:
        description: "Path to the custom kubeconfig file if use_custom_kubeconfig is true"
        required: false
        type: string
        default: ""

    secrets:
      dockerhub_username:
        required: true
      dockerhub_token:
        required: true
      discord_webhook:
        required: false
      NEXUS_USERNAME:
        required: true
      NEXUS_PASSWORD:
        required: true
      NEXUS_URL:
        required: true


permissions:
  contents: read

jobs:
  deploy:
    name: Deploy To EKS
    runs-on: [self-hosted, linux, x64, aws]

    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_STAGING_BUILDS_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Explain deploy execution location
        run: |
          echo "This deploy job is running on the GitHub self-hosted runner."
          echo "kubectl and commands below execute directly from that runner."

      - name: Configure AWS credentials
        if: ${{ inputs.use_aws_auth == true }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ inputs.aws_role_to_assume }}
          role-chaining: true

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure Kubeconfig (AWS vs Custom)
        run: |
          if [ "${{ inputs.use_custom_kubeconfig }}" = "true" ]; then
            if [ -z "${{ inputs.kubeconfig_path }}" ]; then
              echo "::error::use_custom_kubeconfig is true, but kubeconfig_path is empty!"
              exit 1
            fi
            echo "Using custom kubeconfig path: ${{ inputs.kubeconfig_path }}"
            echo "KUBECONFIG=${{ inputs.kubeconfig_path }}" >> $GITHUB_ENV
          elif [ "${{ inputs.use_aws_auth }}" = "true" ]; then
            echo "Using AWS IAM role and updating kubeconfig via aws eks update-kubeconfig..."
            aws eks update-kubeconfig \
              --name "${{ inputs.eks_cluster_name }}" \
              --region "${{ inputs.aws_region }}"
          else
            echo "::notice::Skipping external auth/kubeconfig configuration as requested."
          fi

      - name: Verify cluster access
        id: verify_cluster
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Send EKS Access Failed Alert
        if: ${{ failure() && steps.verify_cluster.outcome == 'failure' && env.DISCORD_WEBHOOK != '' }}
        run: |
          CONTENT=$(cat <<EOF
          🚨 **CD - EKS Access Failed**
          Repository : ${{ github.repository }}
          Branch/Tag : ${{ github.ref_name }}
          Trigger    : ${{ github.event_name == 'workflow_dispatch' && 'Manual' || 'Auto' }}
          Runner     : Self-Hosted
          Cluster    : ${{ inputs.eks_cluster_name }}
          Namespace  : ${{ inputs.kubernetes_namespace }}
          Status     : ❌ FAILED
          Reason     : Runner could not access the EKS cluster.

          Run:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )
          curl \
            -F "content=${CONTENT}" \
            "$DISCORD_WEBHOOK"

      - name: Ensure namespace exists
        run: |
          kubectl get namespace "${{ inputs.kubernetes_namespace }}" >/dev/null 2>&1 || \
          kubectl create namespace "${{ inputs.kubernetes_namespace }}"

      - name: Apply Kubernetes manifests one by one
        run: |
          files=(
            "${{ inputs.manifest_dir }}/deployment.yaml"
          )

          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "Applying $file"
              kubectl apply -f "$file"
            fi
          done

      - name: Update formio image
        run: |
          kubectl set image deployment/${{ inputs.formio_deployment_name }} \
            ${{ inputs.formio_container_name }}=${{ inputs.docker_image }} \
            --namespace "${{ inputs.kubernetes_namespace }}"

      - name: Wait for formio rollout
        run: |
          kubectl rollout status deployment/${{ inputs.formio_deployment_name }} \
            --namespace "${{ inputs.kubernetes_namespace }}" \
            --timeout=300s

      - name: Download Unit Test Report from Nexus
        if: always()
        continue-on-error: true
        run: |
          mkdir -p reports/unit-test
          curl -sS -f -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" \
            -o reports/unit-test/unit-test-report.txt \
            "${{ secrets.NEXUS_URL }}/repository/CredIssuer/reports/${{ github.event.repository.name }}/${{ github.run_id }}/unit-test-report.txt" || true

      - name: Download Trivy Report from Nexus
        if: always()
        continue-on-error: true
        run: |
          mkdir -p reports/trivy
          curl -sS -f -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" \
            -o reports/trivy/trivy-report.txt \
            "${{ secrets.NEXUS_URL }}/repository/CredIssuer/reports/${{ github.event.repository.name }}/${{ github.run_id }}/trivy-report.txt" || true

      - name: Show deployment summary
        run: |
          kubectl get deploy,po,svc \
            --namespace "${{ inputs.kubernetes_namespace }}"

      - name: Send Final Deployment Report
        if: always() && env.DISCORD_WEBHOOK != ''
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            DEPLOY_STATUS="PASSED"
            DEPLOY_EMOJI="✅"
          else
            DEPLOY_STATUS="FAILED"
            DEPLOY_EMOJI="❌"
          fi

          if [ -f reports/unit-test/unit-test-report.txt ]; then
            UNIT_REPORT_STATUS="📎 Attached"
          else
            UNIT_REPORT_STATUS="❌ Not available"
          fi

          if [ -f reports/trivy/trivy-report.txt ]; then
            TRIVY_REPORT_STATUS="📎 Attached"
          else
            TRIVY_REPORT_STATUS="❌ Not available"
          fi

          CONTENT=$(cat <<EOF
          🚀 **Deployment Report**

          Repository : ${{ github.repository }}
          Branch/Tag : ${{ github.ref_name }}

          Cluster    : ${{ inputs.eks_cluster_name }}
          Namespace  : ${{ inputs.kubernetes_namespace }}

          Deployment : ${DEPLOY_EMOJI} ${DEPLOY_STATUS}

          Unit Tests : ${{ inputs.unit_test_status }}
          Trivy      : ${{ inputs.trivy_status }}

          Unit Test Report : ${UNIT_REPORT_STATUS}
          Trivy Report     : ${TRIVY_REPORT_STATUS}

          Triggered By : ${{ github.actor }}
          Runner       : Self-Hosted

          🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )

          CURL_ARGS=(
            -sS
            --fail-with-body
            -F "content=${CONTENT}"
          )

          if [ -f reports/unit-test/unit-test-report.txt ]; then
            CURL_ARGS+=(-F "file1=@reports/unit-test/unit-test-report.txt")
          fi

          if [ -f reports/trivy/trivy-report.txt ]; then
            CURL_ARGS+=(-F "file2=@reports/trivy/trivy-report.txt")
          fi

          curl "${CURL_ARGS[@]}" "$DISCORD_WEBHOOK" || {
            echo "⚠️ Discord notification failed"
            exit 0
          }