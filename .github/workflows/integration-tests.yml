      #     message="Formio unit tests finished with status ${{ job.status }} for ${GITHUB_REF_NAME}. Link: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      #     curl -X POST -H "Content-Type: application/json" -d "{\"content\":\"$message\"}" "${{ secrets.discord_webhook }}"
