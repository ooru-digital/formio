name: Production Build and Deploy

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Enter branch name to build and deploy"
        required: true
        default: "main"
        type: string

      deploy_to_eks:
        description: "Do you want to deploy to Production EKS?"
        required: true
        default: true
        type: boolean

      image_tag:
        description: "Enter Docker image tag prefix"
        required: false
        default: "latest"
        type: string

concurrency:
  group: formio-deployments
  cancel-in-progress: false
  queue: max

jobs:
  # ---------------------------------------------------------
  # UNIT TESTS
  # ---------------------------------------------------------
  trigger-unit-tests:
    name: Production Unit Tests
    uses: ./.github/workflows/unit-test.yml

    with:
      branch: ${{ inputs.branch }}

    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_PRODUCTION_BUILDS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}

  # ---------------------------------------------------------
  # BUILD + SECURITY SCANS + DOCKER PUSH
  # ---------------------------------------------------------
  container_pipeline:
    name: Production Container Pipeline

    needs:
      - trigger-unit-tests

    if: ${{ needs.trigger-unit-tests.result == 'success' }}

    uses: ./.github/workflows/container-pipeline.yml

    with:
      branch: ${{ inputs.branch }}
      registry: docker.io
      image_repository: ${{ vars.DOCKERHUB_IMAGE_REPOSITORY_PROD }}
      image_tag_prefix: ${{ inputs.image_tag || 'latest' }}
      django_env: PRODUCTION
      docker_context: .
      dockerfile: Dockerfile
      fail_on_gitleaks: true
      max_image_layers: 35
      max_image_size_mb: 3500
      push_image: true

    secrets:
      registry_username: ${{ secrets.DOCKERHUB_USERNAME }}
      registry_password: ${{ secrets.DOCKERHUB_TOKEN }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_PRODUCTION_BUILDS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}

  # ---------------------------------------------------------
  # DEPLOY TO PRODUCTION EKS
  # ---------------------------------------------------------
  deploy:
    name: Production Deploy To EKS

    needs:
      - trigger-unit-tests
      - container_pipeline

    if: >-
      ${{
        inputs.deploy_to_eks &&
        needs.trigger-unit-tests.result == 'success' &&
        needs.container_pipeline.result == 'success'
      }}

    uses: ./.github/workflows/deploy-eks.yml

    with:
      aws_region: ${{ vars.AWS_REGION }}
      aws_role_to_assume: ${{ vars.PRODUCTION_GITHUB_ACTIONS_AWS_ROLE_ARN }}
      eks_cluster_name: ${{ vars.PRODUCTION_EKS_CLUSTER_NAME }}
      kubernetes_namespace: ${{ vars.PRODUCTION_KUBERNETES_NAMESPACE }}
      manifest_dir: deploy/eks/production
      docker_image: docker.io/${{ vars.DOCKERHUB_IMAGE_REPOSITORY_PROD }}:${{ needs.container_pipeline.outputs.image_tag }}
      image_pull_secret_name: dockerhub-registry
      formio_deployment_name: formio
      formio_container_name: formio
      unit_test_status: ${{ needs.trigger-unit-tests.outputs.test_status }}
      trivy_status: ${{ needs.container_pipeline.outputs.trivy_status }}
      use_aws_auth: false
      use_custom_kubeconfig: true
      kubeconfig_path: "/home/ubuntu/.kube/prod.conf"

    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_PRODUCTION_BUILDS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}

  # ---------------------------------------------------------
  # FINAL PIPELINE NOTIFICATION
  # ---------------------------------------------------------
  notify:
    name: Pipeline Result Notification

    needs:
      - trigger-unit-tests
      - container_pipeline
      - deploy

    if: ${{ always() }}

    runs-on: [self-hosted, linux, x64, aws]

    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_PRODUCTION_BUILDS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      REPOSITORY_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Download Unit Test Report from Nexus
        if: env.DISCORD_WEBHOOK != ''
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p reports/unit-test

          curl -sS -f \
            -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
            -o reports/unit-test/unit-test-report.txt \
            "${NEXUS_URL}/repository/CredIssuer/reports/${REPOSITORY_NAME}/${GITHUB_RUN_ID}/unit-test-report.txt"

      - name: Download Trivy Report from Nexus
        if: env.DISCORD_WEBHOOK != ''
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p reports/trivy

          curl -sS -f \
            -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
            -o reports/trivy/trivy-report.txt \
            "${NEXUS_URL}/repository/CredIssuer/reports/${REPOSITORY_NAME}/${GITHUB_RUN_ID}/trivy-report.txt"

      - name: Determine outcome and send single Discord alert
        if: env.DISCORD_WEBHOOK != ''
        shell: bash

        env:
          UNIT_TEST_RESULT: ${{ needs.trigger-unit-tests.result }}
          CONTAINER_RESULT: ${{ needs.container_pipeline.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DEPLOY_ENABLED: ${{ inputs.deploy_to_eks }}
          BUILD_BRANCH: ${{ inputs.branch }}
          IMAGE_REPOSITORY: ${{ vars.DOCKERHUB_IMAGE_REPOSITORY_PROD }}
          BUILT_IMAGE_TAG: ${{ needs.container_pipeline.outputs.image_tag }}

        run: |
          set -euo pipefail

          FAILED_STAGE=""
          REASON=""
          DEPLOY_DISPLAY="$DEPLOY_RESULT"

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [ "$DEPLOY_ENABLED" != "true" ]; then
            DEPLOY_DISPLAY="skipped (disabled by user)"
          fi

          if [ "$UNIT_TEST_RESULT" = "failure" ]; then
            FAILED_STAGE="Unit Tests"
            REASON="Unit test job failed. Check the job logs."
          elif [ "$CONTAINER_RESULT" = "failure" ]; then
            FAILED_STAGE="Container Pipeline"
            REASON="Build, security scans, or Docker push failed."
          elif [ "$DEPLOY_RESULT" = "failure" ]; then
            FAILED_STAGE="Deploy To EKS"
            REASON="Deployment failed, or rollout did not become healthy."
          fi

          if [ -n "$FAILED_STAGE" ]; then
            TITLE="❌ Production Pipeline Failed"
          elif [ "$UNIT_TEST_RESULT" = "cancelled" ] ||
               [ "$CONTAINER_RESULT" = "cancelled" ] ||
               [ "$DEPLOY_RESULT" = "cancelled" ]; then
            TITLE="⚠️ Production Pipeline Cancelled"
            REASON="One or more pipeline stages were cancelled."
          elif [ "$UNIT_TEST_RESULT" = "success" ] &&
               [ "$CONTAINER_RESULT" = "success" ] &&
               { [ "$DEPLOY_ENABLED" != "true" ] ||
                 [ "$DEPLOY_RESULT" = "success" ]; }; then
            if [ "$DEPLOY_ENABLED" = "true" ]; then
              TITLE="✅ Production Build & Deploy Successful"
            else
              TITLE="✅ Production Build Successful"
              REASON="Deployment was disabled by user."
            fi
          else
            TITLE="⚠️ Production Pipeline Incomplete"
            REASON="One or more required stages did not complete successfully."
          fi

          DOCKER_IMAGE="Not available"

          if [ -n "$BUILT_IMAGE_TAG" ]; then
            DOCKER_IMAGE="docker.io/${IMAGE_REPOSITORY}:${BUILT_IMAGE_TAG}"
          fi

          CONTENT=$(cat <<EOF
          **${TITLE}**

          **Repository** : ${GITHUB_REPOSITORY}
          **Branch** : ${BUILD_BRANCH}
          **Deploy Enabled** : ${DEPLOY_ENABLED}
          EOF
          )

          if [ -n "$FAILED_STAGE" ]; then
            CONTENT+=$'\n'"**Failed Stage** : ${FAILED_STAGE}"
          fi

          if [ -n "$REASON" ]; then
            CONTENT+=$'\n'"**Reason** : ${REASON}"
          fi

          CONTENT+=$(cat <<EOF


          **Pipeline Status**
          Unit Tests       : ${UNIT_TEST_RESULT}
          Container Build  : ${CONTAINER_RESULT}
          Deploy To EKS    : ${DEPLOY_DISPLAY}

          **Docker Image** : ${DOCKER_IMAGE}
          **Triggered By** : ${GITHUB_ACTOR}
          🔗 ${RUN_URL}
          EOF
          )

          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')

          curl -sS --fail-with-body \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK"
